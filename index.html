<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#8fd6ff" />
<title>🐕 Puppy World — Dog Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #8fd6ff;
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo", system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  #boneCounter {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px;
    background: rgba(255,255,255,0.85); border: 4px solid #ffb3d9; border-radius: 22px;
    padding: 8px 16px; font-size: 22px; font-weight: bold; color: #c2185b;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 0 rgba(0,0,0,0.12);
  }
  #catCounter {
    position: absolute; top: calc(max(14px, env(safe-area-inset-top)) + 56px); left: 14px;
    background: rgba(255,255,255,0.85); border: 4px solid #b3e0ff; border-radius: 22px;
    padding: 6px 14px; font-size: 18px; font-weight: bold; color: #1565c0;
    display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 0 rgba(0,0,0,0.12);
  }
  #scoreBox {
    position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px;
    background: rgba(255,255,255,0.85); border: 4px solid #ffe08a; border-radius: 22px;
    padding: 8px 16px; font-size: 18px; font-weight: bold; color: #e08a00;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
  }
  #levelBox {
    position: absolute; top: calc(max(14px, env(safe-area-inset-top)) + 50px); right: 14px;
    background: rgba(255,255,255,0.85); border: 4px solid #c8a8ff; border-radius: 22px;
    padding: 6px 14px; font-size: 18px; font-weight: bold; color: #7e3ff2;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
  }

  /* ---------- Big banner message ---------- */
  #banner {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%,-50%) scale(0.5);
    background: rgba(255,255,255,0.95); border: 6px solid #ff8ac2; border-radius: 28px;
    padding: 18px 28px; font-size: 26px; font-weight: bold; color: #d6336c; text-align: center;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15); opacity: 0; transition: opacity .3s, transform .3s;
    max-width: 80vw;
  }
  #banner.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  /* ---------- Joystick ---------- */
  #joyZone { position: fixed; left: 0; bottom: 0; width: 55%; height: 60%; z-index: 20; }
  #joyBase {
    position: absolute; width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,0.25); border: 4px solid rgba(255,255,255,0.6);
    display: none; pointer-events: none; transform: translate(-50%,-50%);
  }
  #joyKnob {
    position: absolute; width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ff9ecb);
    border: 4px solid #fff; display: none; pointer-events: none; transform: translate(-50%,-50%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }

  /* ---------- Action buttons ---------- */
  .actBtn {
    position: fixed; z-index: 20; width: 86px; height: 86px; border-radius: 50%;
    border: 5px solid #fff; font-size: 38px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 rgba(0,0,0,0.18); pointer-events: auto; cursor: pointer;
    transition: transform .07s;
  }
  .actBtn:active { transform: scale(0.9) translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  #barkBtn { right: 24px; bottom: max(28px, env(safe-area-inset-bottom)); background: #ffd36b; }
  #jumpBtn { right: 124px; bottom: calc(max(28px, env(safe-area-inset-bottom)) + 16px); background: #9be08a; width: 74px; height: 74px; font-size: 32px; }

  /* ---------- Start screen ---------- */
  /* Scrollable + size-capped so it fits (and PLAY stays reachable) on a wide,
     short desktop window as well as a tall phone. */
  #start {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, #8fd6ff 0%, #b8eaff 50%, #c8f5b8 100%);
    padding: 16px; overflow-y: auto;
  }
  #start > * { flex-shrink: 0; }
  #start h1 { font-size: clamp(36px, 12vw, 64px); color: #fff; text-shadow: 0 4px 0 #ff8ac2, 0 8px 14px rgba(0,0,0,0.2); margin-bottom: 4px; line-height: 1.05; }
  #start p { font-size: clamp(15px, 4.2vw, 21px); color: #d6336c; background: rgba(255,255,255,0.7); padding: 7px 16px; border-radius: 18px; margin: 5px; max-width: min(90vw, 640px); }
  #dogPick { display: flex; gap: 12px; margin: 12px 0; flex-wrap: wrap; justify-content: center; }
  .dogSwatch { width: clamp(44px, 12vw, 56px); height: clamp(44px, 12vw, 56px); border-radius: 50%; border: 5px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.15); cursor: pointer; }
  .dogSwatch.sel { border-color: #ffd000; transform: scale(1.15); }
  #playBtn {
    margin-top: 8px; font-size: clamp(26px, 7vw, 38px); font-weight: bold; color: #fff; background: #ff7ab6;
    border: 6px solid #fff; border-radius: 40px; padding: 12px 46px; cursor: pointer;
    box-shadow: 0 8px 0 #d6337c; transition: transform .08s;
  }
  #playBtn:active { transform: translateY(5px); box-shadow: 0 3px 0 #d6337c; }
  #loading { color: #fff; font-size: clamp(16px, 4.5vw, 22px); max-width: 90vw; }
  #loading.error { color: #b00020; background: rgba(255,255,255,0.92); padding: 12px 18px; border-radius: 14px; font-size: clamp(13px, 3.4vw, 16px); }

  #version {
    position: fixed; left: 8px; bottom: 6px; z-index: 60;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    color: rgba(0,0,0,0.5); background: rgba(255,255,255,0.55);
    padding: 2px 8px; border-radius: 10px; pointer-events: none;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div id="boneCounter">🦴 <span id="boneText">0 / 0</span></div>
    <div id="catCounter">🐱 <span id="catText">0</span></div>
    <div id="scoreBox">⭐ <span id="scoreText">0</span><span style="font-size:13px;color:#a36a00;">&nbsp; 🏆 <span id="bestText">0</span></span></div>
    <div id="levelBox">🌟 Level <span id="levelText">1</span></div>
    <div id="banner"></div>
  </div>

  <div id="joyZone"></div>
  <div id="joyBase"></div>
  <div id="joyKnob"></div>

  <div id="jumpBtn" class="actBtn">⬆️</div>
  <div id="barkBtn" class="actBtn">🐶</div>

  <div id="version">Puppy World</div>

  <div id="start">
    <h1>🐕 Puppy World</h1>
    <p>Run around and collect all the 🦴 bones!</p>
    <p>Find 🐱 kittens — they will follow you! 💕</p>
    <p>Got all the bones? Go sleep in your 🏠 house!</p>
    <div>
      <p style="font-size:4.5vw; margin-bottom:0;">Pick your puppy color:</p>
      <div id="dogPick"></div>
    </div>
    <p id="bestStart" style="font-size:4.5vw; background:rgba(255,255,255,0.85); color:#a36a00;"></p>
    <div id="playBtn">PLAY! ▶</div>
    <div id="loading" class="hidden">Loading puppies… 🐾</div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { createGame } from './game.js';

// Boot the game and wire up the start screen.
const game = createGame(THREE);
window.__puppyGame = game;   // handy for debugging from the console
game.startScreen();
</script>
</body>
</html>
